<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ernährungsplan App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a}
.app{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;padding:0 0 80px;position:relative}
.tab-bar{display:flex;border-bottom:1px solid #e5e5e5;position:sticky;top:0;background:#fff;z-index:10}
.tab{flex:1;padding:10px 2px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;color:#888;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#111;border-bottom:2px solid #111}
.screen{display:none;padding:14px}
.screen.active{display:block}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:12px}
.label{font-size:11px;color:#888;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.big-num{font-size:26px;font-weight:500;color:#111;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.metric{background:#f8f8f8;border-radius:8px;padding:10px 11px}
.metric .val{font-size:19px;font-weight:500;color:#111}
.metric .lbl{font-size:11px;color:#888;margin-top:2px}
.metric .rest{font-size:11px;margin-top:3px;font-weight:500}
.bar-wrap{background:#f0f0f0;border-radius:99px;height:7px;overflow:hidden;margin:5px 0}
.bar-fill{height:100%;border-radius:99px;transition:width 0.4s}
.meal-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0}
.meal-row:last-child{border-bottom:none}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:13px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-macro{font-size:11px;color:#888;margin-top:2px}
.del-btn{background:none;border:none;cursor:pointer;color:#aaa;font-size:18px;padding:2px 4px;line-height:1}
.section-head{font-size:13px;font-weight:500;color:#888;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.add-btn{width:100%;padding:11px;border:1px dashed #ccc;border-radius:8px;background:none;cursor:pointer;font-size:13px;color:#888;display:flex;align-items:center;justify-content:center;gap:5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;padding:18px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:500;margin-bottom:12px;color:#111}
.close-btn{float:right;background:none;border:none;cursor:pointer;font-size:22px;color:#888;line-height:1;padding:0}
.inp{width:100%;padding:9px 12px;font-size:14px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;color:#111;margin-bottom:8px}
.inp-row{display:flex;gap:7px;margin-bottom:8px}
.inp-row .inp{margin-bottom:0;flex:1}
.inp-row .inp.sm{width:80px;flex:none}
.primary-btn{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px}
.secondary-btn{width:100%;padding:10px;background:none;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;color:#111;margin-top:6px}
.cat-filter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:5px 10px;border:1px solid #ddd;border-radius:99px;font-size:11px;cursor:pointer;background:none;color:#888;white-space:nowrap}
.cat-btn.active{background:#111;color:#fff;border-color:#111}
.food-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.food-item:last-child{border-bottom:none}
.food-name{font-size:13px;font-weight:500;color:#111;flex:1}
.food-detail{font-size:11px;color:#888;margin-top:2px}
.food-kcal{font-size:13px;font-weight:500;color:#111;white-space:nowrap}
.food-badge{font-size:10px;padding:2px 6px;border-radius:99px;font-weight:500}
.badge-r{background:#E1F5EE;color:#085041}
.badge-e{background:#EBF5FB;color:#0C447C}
.badge-off{background:#FFF3CD;color:#7D5A00}
.hist-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0}
.hist-row:last-child{border-bottom:none}
.hist-date{font-size:12px;color:#888;width:70px}
.hist-w{font-size:15px;font-weight:500;color:#111}
.hist-diff{font-size:12px;font-weight:500;margin-left:auto}
.diff-neg{color:#1D9E75}
.diff-pos{color:#E24B4A}
.sport-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0}
.sport-row:last-child{border-bottom:none}
.sport-kcal{font-size:13px;font-weight:500;color:#1D9E75;white-space:nowrap}
.tab-sub{display:flex;gap:6px;margin-bottom:12px}
.tab-sub-btn{flex:1;padding:8px;font-size:12px;font-weight:500;border:1px solid #ddd;border-radius:8px;background:none;cursor:pointer;color:#888}
.tab-sub-btn.active{background:#111;color:#fff;border-color:#111}
.empty-state{text-align:center;padding:22px 0;color:#888;font-size:13px}
.tip{font-size:12px;color:#888;padding:8px 12px;background:#f8f8f8;border-radius:8px;margin-bottom:10px;line-height:1.5}
.range-btn{padding:5px 10px;border:1px solid #ddd;border-radius:99px;font-size:11px;cursor:pointer;background:none;color:#888}
.range-btn.active{background:#111;color:#fff;border-color:#111}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#111;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.off-result{padding:10px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.off-result:last-child{border-bottom:none}
.off-name{font-size:13px;font-weight:500;color:#111}
.off-macros{font-size:11px;color:#888;margin-top:2px}
.ing-card{background:#f8f8f8;border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid #eee}
</style>
</head>
<body>
<div class="app">
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('heute')">Heute</div>
  <div class="tab" onclick="switchTab('morgen')">Morgen</div>
  <div class="tab" onclick="switchTab('gewicht')">Gewicht</div>
  <div class="tab" onclick="switchTab('datenbank')">Rezepte</div>
  <div class="tab" onclick="switchTab('sport')">Sport</div>
</div>
<div id="heute" class="screen active"></div>
<div id="morgen" class="screen"></div>
<div id="gewicht" class="screen"></div>
<div id="datenbank" class="screen"></div>
<div id="sport" class="screen"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-content"></div></div>
</div>

<script>
const BUILTIN=[
  {id:'b1',cat:'Frühstück',name:'Joghurt-Bowl mit Beeren',portion:'250g Joghurt+80g Beeren',kcal:280,ew:20,fett:8,kh:22,type:'builtin'},
  {id:'b2',cat:'Frühstück',name:'Rührei mit Wurst & Gemüse',portion:'3 Eier+50g Wurst',kcal:360,ew:28,fett:22,kh:6,type:'builtin'},
  {id:'b3',cat:'Frühstück',name:'Naturquark mit Beeren & Haferflocken',portion:'200g Quark+30g Hfl.',kcal:290,ew:22,fett:3,kh:32,type:'builtin'},
  {id:'b4',cat:'Frühstück',name:'Saatenbrot mit Hüttenkäse & Gurke',portion:'2 Scheiben+100g',kcal:270,ew:18,fett:5,kh:28,type:'builtin'},
  {id:'b5',cat:'Frühstück',name:'Grießbrei mit Hafer-/Mandelmilch',portion:'60g Grieß+300ml',kcal:300,ew:12,fett:6,kh:48,type:'builtin'},
  {id:'b6',cat:'Frühstück',name:'Omelett mit Spinat & Käse',portion:'3 Eier+30g Käse',kcal:340,ew:27,fett:22,kh:4,type:'builtin'},
  {id:'b7',cat:'Frühstück',name:'Pumpernickel mit Ei & Gurke',portion:'2 Scheiben+2 Eier',kcal:240,ew:16,fett:9,kh:22,type:'builtin'},
  {id:'b8',cat:'Mittagessen',name:'Hähnchengeschnetzeltes mit Reis',portion:'150g Hähnchen+150g Reis',kcal:480,ew:42,fett:8,kh:52,type:'builtin'},
  {id:'b9',cat:'Mittagessen',name:'Hackfleisch-Pfanne mit Zucchini',portion:'150g Hack+Gemüse',kcal:510,ew:38,fett:18,kh:44,type:'builtin'},
  {id:'b10',cat:'Mittagessen',name:'Kürbissuppe mit Kokosmilch & Hähnchen',portion:'350ml+100g Hähnchen',kcal:380,ew:30,fett:14,kh:28,type:'builtin'},
  {id:'b11',cat:'Mittagessen',name:'Nudeln mit Hackfleisch-Tomatensoße',portion:'80g Nudeln+120g Hack',kcal:560,ew:36,fett:16,kh:60,type:'builtin'},
  {id:'b12',cat:'Mittagessen',name:'Hähnchenbrust mit Kartoffeln & Brokkoli',portion:'150g+200g Kartoffeln',kcal:460,ew:40,fett:6,kh:46,type:'builtin'},
  {id:'b13',cat:'Mittagessen',name:'Spinat-Eiweißpfanne mit Kartoffeln',portion:'3 Eier+150g Kartoffeln',kcal:390,ew:24,fett:14,kh:38,type:'builtin'},
  {id:'b14',cat:'Abendessen',name:'Joghurt mit Gurke & Gewürzgurken',portion:'200g Joghurt+Gurke',kcal:180,ew:14,fett:6,kh:12,type:'builtin'},
  {id:'b15',cat:'Abendessen',name:'Rührei mit Bockwurst & Salat',portion:'2 Eier+1 Bockwurst',kcal:320,ew:22,fett:22,kh:4,type:'builtin'},
  {id:'b16',cat:'Abendessen',name:'Quark-Bowl mit Rohkost',portion:'150g Quark+Gemüse',kcal:210,ew:18,fett:3,kh:16,type:'builtin'},
  {id:'b17',cat:'Abendessen',name:'Wiener mit Kartoffelsalat',portion:'2 Wiener+150g Salat',kcal:350,ew:16,fett:18,kh:28,type:'builtin'},
  {id:'b18',cat:'Abendessen',name:'Hähnchenstreifen mit Eisbergsalat',portion:'120g Hähnchen+Salat',kcal:280,ew:28,fett:10,kh:8,type:'builtin'},
  {id:'b19',cat:'Abendessen',name:'Spinat-Rührei mit Käse',portion:'3 Eier+Spinat+Käse',kcal:300,ew:24,fett:20,kh:4,type:'builtin'},
  {id:'b20',cat:'Snack',name:'Naturquark mit Zimt',portion:'150g',kcal:120,ew:14,fett:1,kh:8,type:'builtin'},
  {id:'b21',cat:'Snack',name:'Griechischer Joghurt mit Beeren',portion:'150g+50g Beeren',kcal:140,ew:10,fett:4,kh:12,type:'builtin'},
  {id:'b22',cat:'Snack',name:'Hartgekochte Eier',portion:'2 Stück',kcal:140,ew:12,fett:10,kh:1,type:'builtin'},
  {id:'b23',cat:'Snack',name:'Rohkost Möhren/Kohlrabi/Gurke',portion:'150g',kcal:55,ew:2,fett:0,kh:10,type:'builtin'},
  {id:'b24',cat:'Snack',name:'Hüttenkäse mit Gewürzgurken',portion:'100g+2 Gurken',kcal:110,ew:12,fett:2,kh:6,type:'builtin'},
];
const SPORT_DB=[
  {name:'Spaziergang (langsam)',met:2.8,kat:'Gehen'},
  {name:'Spaziergang (zügig)',met:3.8,kat:'Gehen'},
  {name:'Nordic Walking',met:5.0,kat:'Gehen'},
  {name:'Joggen (leicht)',met:7.0,kat:'Laufen'},
  {name:'Radfahren (gemäßigt)',met:5.8,kat:'Rad'},
  {name:'Schwimmen',met:6.0,kat:'Wasser'},
  {name:'Krafttraining',met:4.0,kat:'Kraft'},
  {name:'Yoga / Dehnen',met:2.5,kat:'Entspannung'},
  {name:'Hausarbeit intensiv',met:3.5,kat:'Alltag'},
  {name:'Tanzen',met:5.0,kat:'Tanzen'},
];

function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let profile=ls('ep_profile',{gewicht:120,groesse:171,alter:48,aktivitaet:1.2});
let days=ls('ep_days',{});
let weights=ls('ep_weights',[]);
let customMeals=ls('ep_custom',[]);
let rezepte=ls('ep_rezepte',[]);
let sportLog=ls('ep_sport',{});

if(weights.length===0){
  const base=new Date('2025-01-06');
  [120,119.5,119,118.4,117.9,117.2,116.8,116.1,115.6,114.9,114.2,113.7].forEach((w,i)=>{
    const d=new Date(base);d.setDate(d.getDate()+i*7);
    weights.push({date:d.toISOString().slice(0,10),w});
  });
}

function save(){ss('ep_profile',profile);ss('ep_days',days);ss('ep_weights',weights);ss('ep_custom',customMeals);ss('ep_rezepte',rezepte);ss('ep_sport',sportLog);}
function allMeals(){return[...BUILTIN,...customMeals,...rezepte];}
function todayKey(){return new Date().toISOString().slice(0,10);}
function tomorrowKey(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function fmtDate(k){return k.slice(8)+'.'+k.slice(5,7);}

function targets(w){
  const p=profile,wt=w||p.gewicht;
  const gu=447.6+(9.2*wt)+(3.1*p.groesse)-(4.3*p.alter);
  const zk=Math.round(gu*p.aktivitaet-500);
  const ew=Math.round(wt*1.3);
  const fett=Math.round(zk*0.28/9);
  const kh=Math.round((zk-(ew*4)-(fett*9))/4);
  return{zk,ew,fett,kh};
}

function getDay(k){if(!days[k])days[k]={fruehstueck:null,mittagessen:null,abendessen:null,snacks:[]};return days[k];}
function sportKcal(met,dauer,gew){return Math.round(met*(gew||profile.gewicht)*(dauer/60));}
function sportDayTotal(k){return(sportLog[k]||[]).reduce((a,e)=>a+e.kcal,0);}

function dayTotals(k){
  const d=getDay(k);let kcal=0,ew=0,fett=0,kh=0;
  ['fruehstueck','mittagessen','abendessen'].forEach(s=>{if(d[s]){kcal+=d[s].kcal;ew+=d[s].ew;fett+=d[s].fett;kh+=d[s].kh;}});
  d.snacks.forEach(s=>{kcal+=s.kcal;ew+=s.ew;fett+=s.fett;kh+=s.kh;});
  const sk=sportDayTotal(k);
  return{kcal:kcal-sk,sportKcal:sk,ew,fett,kh};
}

function barCol(p){if(p>=1.1)return'#E24B4A';if(p>=0.85)return'#1D9E75';return'#EF9F27';}

function renderDay(sid,dk,label){
  const el=document.getElementById(sid);
  const t=targets(),tot=dayTotals(dk),d=getDay(dk);
  const net=Math.max(0,tot.kcal),kp=Math.min(net/t.zk,1.15),ep=Math.min(tot.ew/t.ew,1.15);
  let html=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <div><div class="label">${label} – Nettokalorien</div><span class="big-num">${net}</span> <span style="font-size:13px;color:#888">/ ${t.zk} kcal</span></div>
      ${tot.sportKcal>0?`<span style="font-size:12px;color:#1D9E75;font-weight:500">Sport −${tot.sportKcal}</span>`:''}
    </div>
    <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(kp*100)}%;background:${barCol(kp)}"></div></div>
    <div style="font-size:12px;color:#888;margin-top:4px">${t.zk-net>0?`noch ${t.zk-net} kcal übrig`:t.zk-net===0?'Ziel erreicht!':'Ziel überschritten'}</div>
  </div>
  <div class="grid3">
    <div class="metric"><div class="val">${tot.ew}g</div><div class="lbl">Eiweiß</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(ep*100)}%;background:#378ADD"></div></div>
      <div class="rest" style="color:${t.ew-tot.ew<=0?'#1D9E75':'#888'}">${t.ew-tot.ew>0?`−${t.ew-tot.ew}g`:'OK'} / ${t.ew}g</div></div>
    <div class="metric"><div class="val">${tot.fett}g</div><div class="lbl">Fett</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(Math.min(tot.fett/t.fett,1.15)*100)}%;background:#EF9F27"></div></div>
      <div class="rest" style="color:#888">/ ${t.fett}g</div></div>
    <div class="metric"><div class="val">${tot.kh}g</div><div class="lbl">KH</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(Math.min(tot.kh/t.kh,1.15)*100)}%;background:#8E44AD"></div></div>
      <div class="rest" style="color:#888">/ ${t.kh}g</div></div>
  </div>`;
  [['fruehstueck','Frühstück'],['mittagessen','Mittagessen'],['abendessen','Abendessen']].forEach(([slot,lbl])=>{
    const e=d[slot];
    html+=`<div class="section-head">${lbl}${e?`<span style="font-size:11px;color:#888;margin-left:auto">${e.kcal} kcal · ${e.ew}g EW</span>`:''}</div>`;
    if(e)html+=`<div class="card" style="padding:10px 14px"><div class="meal-row" style="padding:0"><div class="meal-info"><div class="meal-name">${e.name}</div><div class="meal-macro">${e.portion||''} · EW ${e.ew}g · F ${e.fett}g · KH ${e.kh}g</div></div><button class="del-btn" onclick="removeSlot('${dk}','${slot}')">×</button></div></div>`;
    else html+=`<button class="add-btn" onclick="openPicker('${dk}','${slot}','${lbl}')">+ ${lbl} wählen</button>`;
  });
  html+=`<div class="section-head">Snacks & Naschen${d.snacks.length?`<span style="font-size:11px;color:#888;margin-left:auto">${d.snacks.reduce((a,s)=>a+s.kcal,0)} kcal</span>`:''}</div>`;
  if(d.snacks.length){html+=`<div class="card" style="padding:4px 14px">`;d.snacks.forEach((s,i)=>{html+=`<div class="meal-row"><div class="meal-info"><div class="meal-name">${s.name}</div><div class="meal-macro">EW ${s.ew}g · F ${s.fett}g · KH ${s.kh}g</div></div><span style="font-size:13px;font-weight:500;white-space:nowrap">${s.kcal}</span><button class="del-btn" onclick="removeSnack('${dk}',${i})">×</button></div>`;});html+=`</div>`;}
  html+=`<button class="add-btn" onclick="openSnack('${dk}')">+ Snack / Naschen</button>`;
  const sl=sportLog[dk]||[];
  if(sl.length){html+=`<div class="section-head">Sport<span style="font-size:11px;color:#1D9E75;margin-left:auto">−${sportDayTotal(dk)} kcal</span></div><div class="card" style="padding:4px 14px">`;sl.forEach((e,i)=>{html+=`<div class="meal-row"><div class="meal-info"><div class="meal-name">${e.name}</div><div class="meal-macro">${e.dauer} Min.</div></div><span class="sport-kcal">−${e.kcal}</span><button class="del-btn" onclick="removeSport('${dk}',${i})">×</button></div>`;});html+=`</div>`;}
  html+=`<button class="add-btn" onclick="openSportPicker('${dk}')">+ Sport eintragen</button>`;
  if(sid==='morgen'&&days[todayKey()])html+=`<button class="secondary-btn" onclick="copyDay()">Heutigen Plan für morgen übernehmen</button>`;
  el.innerHTML=html;
}

function removeSlot(dk,s){getDay(dk)[s]=null;save();refresh();}
function removeSnack(dk,i){getDay(dk).snacks.splice(i,1);save();refresh();}
function removeSport(dk,i){if(sportLog[dk])sportLog[dk].splice(i,1);save();refresh();}
function copyDay(){days[tomorrowKey()]=JSON.parse(JSON.stringify(days[todayKey()]||{}));save();refresh();}

function openPicker(dk,slot,lbl){
  let search='',activeCat='Alle';
  const cats=['Alle','Frühstück','Mittagessen','Abendessen','Snack','Eigene','Rezepte'];
  function render(){
    const filtered=allMeals().filter(m=>{
      const cok=activeCat==='Alle'||(activeCat==='Eigene'&&m.type==='custom')||(activeCat==='Rezepte'&&m.type==='rezept')||m.cat===activeCat;
      return cok&&(!search||m.name.toLowerCase().includes(search.toLowerCase()));
    });
    document.getElementById('modal-content').innerHTML=`
      <button class="close-btn" onclick="closeModal()">×</button>
      <div class="modal-title">${lbl} wählen</div>
      <input class="inp" type="text" placeholder="Suchen..." value="${search}" id="ps" oninput="pSrch(this.value)">
      <div class="cat-filter">${cats.map(c=>`<button class="cat-btn${activeCat===c?' active':''}" onclick="pCat('${c}')">${c}</button>`).join('')}</div>
      ${filtered.map(m=>`<div class="food-item" onclick="pickMeal('${m.id}')">
        <div style="flex:1"><div class="food-name">${m.name}${m.type==='rezept'?' <span class="food-badge badge-r">Rezept</span>':m.type==='custom'?' <span class="food-badge badge-e">Eigen</span>':''}</div>
        <div class="food-detail">${m.portion||''} · EW ${m.ew}g · F ${m.fett}g · KH ${m.kh}g</div></div>
        <span class="food-kcal">${m.kcal}</span></div>`).join('')}
      ${!filtered.length?'<div class="empty-state">Keine Treffer</div>':''}`;
    setTimeout(()=>{const s=document.getElementById('ps');if(s)s.focus();},40);
  }
  window.pSrch=v=>{search=v;activeCat='Alle';render();};
  window.pCat=c=>{activeCat=c;render();};
  window.pickMeal=id=>{const m=allMeals().find(x=>x.id==id);if(m){getDay(dk)[slot]={...m};save();closeModal();refresh();}};
  openModal();render();
}

function openSnack(dk){
  let search='';
  function render(){
    const filtered=allMeals().filter(m=>!search||m.name.toLowerCase().includes(search.toLowerCase()));
    document.getElementById('modal-content').innerHTML=`

let chartRange=30;
function renderGewicht(){
  const hist=[...weights].reverse().slice(0,14);
  const t=targets();
  const start=weights.length?weights[0].w:profile.gewicht;
  const latest=weights.length?weights[weights.length-1].w:profile.gewicht;
  const total=Math.round((start-latest)*10)/10;
  document.getElementById('gewicht').innerHTML=`
    <div class="card">
      <div class="label">Gewicht eintragen</div>
      <div style="display:flex;align-items:center;gap:10px;margin:10px 0">
        <input type="number" id="w-inp" value="${profile.gewicht}" step="0.1" min="30" max="300" oninput="previewW(this.value)"
          style="font-size:28px;font-weight:500;width:130px;text-align:center;padding:10px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;color:#111">
        <span style="font-size:20px;color:#888;font-weight:500">kg</span>
      </div>
      <div id="w-preview" style="font-size:12px;color:#888;margin-bottom:10px"></div>
      <button class="primary-btn" onclick="logWeight()">Heute speichern & Ziele aktualisieren</button>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="label" style="margin:0">Verlauf</div>
        <div style="display:flex;gap:5px">${[14,30,90].map(r=>`<button class="range-btn${chartRange===r?' active':''}" onclick="setRange(${r})">${r}T</button>`).join('')}</div>
      </div>
      <canvas id="w-chart" height="160"></canvas>
      <div class="grid3" style="margin-top:12px">
        <div class="metric"><div class="val" style="color:#E24B4A;font-size:16px">${start} kg</div><div class="lbl">Start</div></div>
        <div class="metric"><div class="val" style="color:#1D9E75;font-size:16px">${total>0?'−'+total:'±0'} kg</div><div class="lbl">Abgenommen</div></div>
        <div class="metric"><div class="val" style="font-size:16px">${t.zk}</div><div class="lbl">kcal-Ziel</div></div>
      </div>
    </div>
    <div class="card"><div class="label">Letzte Einträge</div>
      ${hist.length===0?'<div class="empty-state">Noch keine Einträge</div>':''}
      ${hist.map((e,i)=>{const diff=i<hist.length-1?e.w-hist[i+1].w:null;return`<div class="hist-row"><span class="hist-date">${fmtDate(e.date)}</span><span class="hist-w">${e.w.toFixed(1)} kg</span>${diff!==null?`<span class="hist-diff ${diff<0?'diff-neg':'diff-pos'}">${diff>0?'+':''}${diff.toFixed(1)} kg</span>`:'<span class="hist-diff" style="color:#888">Start</span>'}</div>`;}).join('')}
    </div>`;
  previewW(profile.gewicht);drawChart();
}

window.previewW=v=>{const val=parseFloat(v);if(isNaN(val)||val<30)return;const t=targets(val);const el=document.getElementById('w-preview');if(el)el.innerHTML=`Neue Ziele: <strong>${t.zk} kcal</strong> · EW <strong>${t.ew}g</strong> · Fett <strong>${t.fett}g</strong>`;};
window.setRange=r=>{chartRange=r;renderGewicht();};

function logWeight(){
  const val=parseFloat(document.getElementById('w-inp').value);
  if(isNaN(val)||val<30)return;
  profile.gewicht=Math.round(val*10)/10;
  const today=todayKey();
  const idx=weights.findIndex(e=>e.date===today);
  if(idx>=0)weights[idx].w=profile.gewicht;else weights.push({date:today,w:profile.gewicht});
  save();renderGewicht();refresh();
}

function drawChart(){
  const canvas=document.getElementById('w-chart');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-28,H=160;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-chartRange);
  const pts=weights.filter(e=>new Date(e.date)>=cutoff);
  if(pts.length<2){ctx.fillStyle='rgba(128,128,128,0.5)';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('Mehr Einträge für Grafik nötig',W/2,H/2);return;}
  const minW=Math.min(...pts.map(p=>p.w)),maxW=Math.max(...pts.map(p=>p.w));
  const pad={t:16,r:12,b:28,l:46},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,rng=maxW-minW||1;
  const px=i=>pad.l+i*(cw/(pts.length-1));
  const py=w=>pad.t+ch-(((w-minW)/rng)*ch);
  for(let i=0;i<=4;i++){const y=pad.t+(ch/4)*i;ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle='#aaa';ctx.font='10px system-ui';ctx.textAlign='right';ctx.fillText((maxW-((maxW-minW)/4)*i).toFixed(1),pad.l-4,y+3);}
  const n=pts.length,sx=pts.reduce((a,_,i)=>a+i,0),sy=pts.reduce((a,p)=>a+p.w,0),sxy=pts.reduce((a,p,i)=>a+i*p.w,0),sxx=pts.reduce((a,_,i)=>a+i*i,0);
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx),intercept=(sy-slope*sx)/n;
  ctx.strokeStyle='rgba(29,158,117,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(px(0),py(intercept));ctx.lineTo(px(pts.length-1),py(intercept+slope*(pts.length-1)));ctx.stroke();ctx.setLineDash([]);
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0,'rgba(55,138,221,0.18)');grad.addColorStop(1,'rgba(55,138,221,0)');
  ctx.beginPath();ctx.moveTo(px(0),py(pts[0].w));pts.forEach((p,i)=>{if(i>0)ctx.lineTo(px(i),py(p.w));});
  ctx.lineTo(px(pts.length-1),pad.t+ch);ctx.lineTo(px(0),pad.t+ch);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='#378ADD';ctx.lineWidth=2;ctx.lineJoin='round';
  ctx.beginPath();pts.forEach((p,i)=>{i===0?ctx.moveTo(px(i),py(p.w)):ctx.lineTo(px(i),py(p.w));});ctx.stroke();
  pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(px(i),py(p.w),3.5,0,Math.PI*2);ctx.fillStyle='#378ADD';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.5;ctx.stroke();
    if(i===0||i===pts.length-1||i===Math.floor(pts.length/2)){ctx.fillStyle='#aaa';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(fmtDate(p.date),px(i),H-6);}});
}

async function searchOFF(query){
  const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8&lc=de`;
  const res=await fetch(url);
  const data=await res.json();
  return(data.products||[]).filter(p=>p.nutriments&&p.nutriments['energy-kcal_100g']>0).map(p=>({
    name:p.product_name||p.product_name_de||'Unbekannt',
    brand:p.brands||'',
    kcal100:Math.round(p.nutriments['energy-kcal_100g']||0),
    ew100:Math.round((p.nutriments['proteins_100g']||0)*10)/10,
    fett100:Math.round((p.nutriments['fat_100g']||0)*10)/10,
    kh100:Math.round((p.nutriments['carbohydrates_100g']||0)*10)/10,
  }));
}

window.doSearchOFF=async(i)=>{
  const nameEl=document.getElementById(`ing-name-${i}`);
  const resEl=document.getElementById(`off-results-${i}`);
  if(!nameEl||!resEl)return;
  const query=nameEl.value||ingredients[i].name;

  resEl.innerHTML=`<div style="padding:10px 0;font-size:13px;color:#888"><span class="spin"></span> Suche läuft...</div>`;
  try{
    const results=await searchOFF(query);
    if(!results.length){resEl.innerHTML=`<div style="font-size:12px;color:#888;padding:8px 0">Keine Ergebnisse – bitte manuell eingeben.</div>`;return;}
    window._offR=window._offR||{};window._offR[i]=results;

window.calcRez=()=>{
  const name=document.getElementById('rn').value||'Mein Rezept';
  const port=Math.max(1,+document.getElementById('rp').value||1);
  const cat=document.getElementById('rcat').value;
  let tk=0,te=0,tf=0,tkh=0;
  ingredients.forEach(g=>{const f=(g.g||0)/100;tk+=g.kcal100*f;te+=g.ew100*f;tf+=g.fett100*f;tkh+=g.kh100*f;});
  const pk=Math.round(tk/port),pe=Math.round(te/port),pf=Math.round(tf/port),pkh=Math.round(tkh/port);
  document.getElementById('rez-result').innerHTML=`<div class="card" style="background:#f8f8f8;margin-top:8px">
    <div style="font-weight:500;font-size:13px;margin-bottom:4px">${name} – pro Portion</div>

    <div class="grid2"><div class="metric"><div class="val">${pk}</div><div class="lbl">kcal</div></div><div class="metric"><div class="val">${pe}g</div><div class="lbl">Eiweiß</div></div><div class="metric"><div class="val">${pf}g</div><div class="lbl">Fett</div></div><div class="metric"><div class="val">${pkh}g</div><div class="lbl">KH</div></div></div>
    <button class="primary-btn" onclick="saveRez('${name.replace(/'/g,"&#39;")}',${port},'${cat}',${pk},${pe},${pf},${pkh})">Rezept speichern</button>
  </div>`;
};

window.saveCM=()=>{
  const name=document.getElementById('cm-n').value;if(!name)return;
  customMeals.push({id:'c'+Date.now(),name,cat:document.getElementById('cm-c').value,portion:document.getElementById('cm-p').value,kcal:+document.getElementById('cm-k').value||0,ew:+document.getElementById('cm-e').value||0,fett:+document.getElementById('cm-f').value||0,kh:+document.getElementById('cm-kh').value||0,type:'custom'});
  save();closeModal();renderDatenbank();
};

function renderSport(){
  const today=todayKey(),sl=sportLog[today]||[],todayK=sl.reduce((a,e)=>a+e.kcal,0),gew=profile.gewicht;
  document.getElementById('sport').innerHTML=`
    <div class="card">
      <div class="label">Heute verbrannt</div>
      <div class="big-num" style="color:#1D9E75">${todayK} <span style="font-size:14px;font-weight:400;color:#888">kcal</span></div>
      ${sl.length?sl.map((e,i)=>`<div class="sport-row"><div style="flex:1"><div style="font-size:13px;font-weight:500">${e.name}</div><div style="font-size:11px;color:#888">${e.dauer} Min.</div></div><span class="sport-kcal">−${e.kcal}</span><button class="del-btn" onclick="removeSport('${today}',${i})">×</button></div>`).join(''):`<div style="font-size:13px;color:#888;padding:8px 0">Noch keine Aktivität heute</div>`}
    </div>
    <button class="add-btn" onclick="openSportPicker('${today}')">+ Aktivität eintragen</button>
    <div class="card" style="margin-top:12px">
      <div class="label">Verbrauch für ${gew} kg</div>
      <div class="tip" style="margin-bottom:10px">MET × Körpergewicht × Stunden. Tracker-Wert ist genauer – einfach manuell eingeben.</div>
      ${SPORT_DB.map(s=>{const k30=sportKcal(s.met,30,gew),k45=sportKcal(s.met,45,gew),k60=sportKcal(s.met,60,gew);
        return`<div class="sport-row"><div style="flex:1"><div style="font-size:13px;font-weight:500">${s.name}</div><div style="font-size:11px;color:#888">MET ${s.met} · ${s.kat}</div></div>
        <div style="text-align:right;font-size:11px;color:#888"><div>30′ <strong style="color:#1D9E75">−${k30}</strong></div><div>45′ <strong style="color:#1D9E75">−${k45}</strong></div><div>60′ <strong style="color:#1D9E75">−${k60}</strong></div></div></div>`;}).join('')}
    </div>`;
}

function openModal(){document.getElementById('modal-bg').className='modal-bg open';}
function closeModal(){document.getElementById('modal-bg').className='modal-bg';}
document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});

let activeTab='heute';
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',['heute','morgen','gewicht','datenbank','sport'][i]===tab);});
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  refresh();
}

function refresh(){
  if(activeTab==='heute')renderDay('heute',todayKey(),'Heute');
  else if(activeTab==='morgen')renderDay('morgen',tomorrowKey(),'Morgen');
  else if(activeTab==='gewicht')renderGewicht();
  else if(activeTab==='datenbank')renderDatenbank();
  else if(activeTab==='sport')renderSport();
}
refresh();
</script>

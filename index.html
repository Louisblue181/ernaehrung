<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ernährungsplan App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a}
.app{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;padding:0 0 80px;position:relative}
.tab-bar{display:flex;border-bottom:1px solid #e5e5e5;position:sticky;top:0;background:#fff;z-index:10}
.tab{flex:1;padding:10px 2px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;color:#888;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#111;border-bottom:2px solid #111}
.screen{display:none;padding:14px}
.screen.active{display:block}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:12px}
.label{font-size:11px;color:#888;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.big-num{font-size:26px;font-weight:500;color:#111;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.metric{background:#f8f8f8;border-radius:8px;padding:10px 11px}
.metric .val{font-size:19px;font-weight:500;color:#111}
.metric .lbl{font-size:11px;color:#888;margin-top:2px}
.metric .rest{font-size:11px;margin-top:3px;font-weight:500}
.bar-wrap{background:#f0f0f0;border-radius:99px;height:7px;overflow:hidden;margin:5px 0}
.bar-fill{height:100%;border-radius:99px;transition:width 0.4s}
.meal-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0}
.meal-row:last-child{border-bottom:none}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:13px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-macro{font-size:11px;color:#888;margin-top:2px}
.del-btn{background:none;border:none;cursor:pointer;color:#aaa;font-size:18px;padding:2px 4px;line-height:1}
.section-head{font-size:13px;font-weight:500;color:#888;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.add-btn{width:100%;padding:11px;border:1px dashed #ccc;border-radius:8px;background:none;cursor:pointer;font-size:13px;color:#888;display:flex;align-items:center;justify-content:center;gap:5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;padding:18px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:500;margin-bottom:12px;color:#111}
.close-btn{float:right;background:none;border:none;cursor:pointer;font-size:22px;color:#888;line-height:1;padding:0}
.inp{width:100%;padding:9px 12px;font-size:14px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;color:#111;margin-bottom:8px}
.inp-row{display:flex;gap:7px;margin-bottom:8px}
.inp-row .inp{margin-bottom:0;flex:1}
.inp-row .inp.sm{width:80px;flex:none}
.primary-btn{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px}
.secondary-btn{width:100%;padding:10px;background:none;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;color:#111;margin-top:6px}
.cat-filter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:5px 10px;border:1px solid #ddd;border-radius:99px;font-size:11px;cursor:pointer;background:none;color:#888;white-space:nowrap}
.cat-btn.active{background:#111;color:#fff;border-color:#111}
.food-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.food-item:last-child{border-bottom:none}
.food-name{font-size:13px;font-weight:500;color:#111;flex:1}
.food-detail{font-size:11px;color:#888;margin-top:2px}
.food-kcal{font-size:13px;font-weight:500;color:#111;white-space:nowrap}
.food-badge{font-size:10px;padding:2px 6px;border-radius:99px;font-weight:500}
.badge-r{background:#E1F5EE;color:#085041}
.badge-e{background:#EBF5FB;color:#0C447C}
.badge-off{background:#FFF3CD;color:#7D5A00}
.hist-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0}
.hist-row:last-child{border-bottom:none}
.hist-date{font-size:12px;color:#888;width:70px}
.hist-w{font-size:15px;font-weight:500;color:#111}
.hist-diff{font-size:12px;font-weight:500;margin-left:auto}
.diff-neg{color:#1D9E75}
.diff-pos{color:#E24B4A}
.sport-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0}
.sport-row:last-child{border-bottom:none}
.sport-kcal{font-size:13px;font-weight:500;color:#1D9E75;white-space:nowrap}
.tab-sub{display:flex;gap:6px;margin-bottom:12px}
.tab-sub-btn{flex:1;padding:8px;font-size:12px;font-weight:500;border:1px solid #ddd;border-radius:8px;background:none;cursor:pointer;color:#888}
.tab-sub-btn.active{background:#111;color:#fff;border-color:#111}
.empty-state{text-align:center;padding:22px 0;color:#888;font-size:13px}
.tip{font-size:12px;color:#888;padding:8px 12px;background:#f8f8f8;border-radius:8px;margin-bottom:10px;line-height:1.5}
.range-btn{padding:5px 10px;border:1px solid #ddd;border-radius:99px;font-size:11px;cursor:pointer;background:none;color:#888}
.range-btn.active{background:#111;color:#fff;border-color:#111}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#111;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.off-result{padding:10px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.off-result:last-child{border-bottom:none}
.off-name{font-size:13px;font-weight:500;color:#111}
.off-macros{font-size:11px;color:#888;margin-top:2px}
.ing-card{background:#f8f8f8;border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid #eee}

.water-bar{background:#f0f0f0;border-radius:99px;height:10px;overflow:hidden;margin:8px 0}
.water-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#54C6EB,#185FA5);transition:width 0.4s}
.water-btn{padding:8px 0;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;cursor:pointer;font-size:13px;font-weight:500;color:#185FA5;flex:1;text-align:center}
.water-btn:active{background:#EBF5FB}
.drop{display:inline-block;font-size:14px}

.tab{font-size:10px!important}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}

.scanner-wrap{position:relative;width:100%;background:#000;border-radius:8px;overflow:hidden;margin-bottom:12px}
.scanner-wrap video{width:100%;display:block}
.scan-line{position:absolute;left:10%;width:80%;height:2px;background:#1D9E75;animation:scanline 2s linear infinite;top:40%}
@keyframes scanline{0%{top:20%}50%{top:70%}100%{top:20%}}
.scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.scan-box{width:200px;height:200px;border:2px solid #1D9E75;border-radius:8px}

.sync-badge{display:none;background:#1D9E75;color:#fff;font-size:10px;padding:2px 7px;border-radius:99px;margin-left:4px;font-weight:500;vertical-align:middle}
.sync-status{font-size:11px;color:#1D9E75;padding:4px 8px;text-align:center;background:#F0FDF4;border-bottom:1px solid #D5F5E3}
</style>
</head>
<body>
<div class="app">
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('heute')">Heute</div>
  <div class="tab" onclick="switchTab('morgen')">Morgen</div>
  <div class="tab" onclick="switchTab('gewicht')">Gewicht</div>
  <div class="tab" onclick="switchTab('datenbank')">Rezepte</div>
  <div class="tab" onclick="switchTab('rezeptbuch')">Buch</div>
  <div class="tab" onclick="switchTab('einkauf')">Einkauf</div>
  <div class="tab" onclick="switchTab('sport')">Sport</div>
  <div class="tab" onclick="switchTab('mounjaro')">💉</div>
</div>
<div id="sync-status-bar" class="sync-status" style="display:flex;align-items:center;justify-content:space-between;padding:4px 12px">
  <span id="sync-badge" style="font-size:11px;color:#1D9E75;font-weight:500"></span>
  <button id="sync-btn" onclick="syncWithSheets()" style="padding:4px 12px;border:1px solid #1D9E75;border-radius:99px;background:none;cursor:pointer;font-size:11px;color:#1D9E75;font-weight:500">🔄 Sync</button>
</div>
<div id="heute" class="screen active"></div>
<div id="morgen" class="screen"></div>
<div id="gewicht" class="screen"></div>
<div id="datenbank" class="screen"></div>
<div id="rezeptbuch" class="screen"></div>
<div id="einkauf" class="screen"></div>
<div id="sport" class="screen"></div>
<div id="mounjaro" class="screen"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-content"></div></div>
</div>

async function loadFromSheets() {
  // Öffnet Sheets-URL in neuem Tab, Daten werden über localStorage übergeben
  // Nutzer muss einmal auf Sync tippen
  try {
    const cached = localStorage.getItem('ep_sheets_cache');
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.meals) sheetsMeals = parsed.meals;
      if (parsed.rezepte) sheetsRezepte = parsed.rezepte;
      sheetsLoaded = true;
      showSyncBadge(sheetsMeals.length + sheetsRezepte.length);
    }
  } catch(e) {
    console.warn('Cache-Fehler:', e);
  }
}

function syncWithSheets() {
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) {
    syncBtn.textContent = '⏳ Lädt...';
    syncBtn.disabled = true;
  }

  // Öffne Sheets als neue URL mit fetch über Redirect-Trick
  const urlL = SHEETS_URL + '?action=getLebensmittel';
  const urlR = SHEETS_URL + '?action=getRezepte';

  Promise.all([
    fetch(urlL).then(r => r.json()).catch(() => null),
    fetch(urlR).then(r => r.json()).catch(() => null)
  ]).then(([dataL, dataR]) => {
    let countL = 0, countR = 0;

    if (dataL && dataL.status === 'ok' && dataL.data) {
      // Duplikate vermeiden: nur laden was nicht schon in BUILTIN ist
      const builtinNames = new Set(BUILTIN.map(m => m.name.toLowerCase().trim()));
      const builtinIds = new Set(BUILTIN.map(m => String(m.id)));
      sheetsMeals = dataL.data
        .filter(r => {
          const name = (r.name||'').toLowerCase().trim();
          const id = String(r.id||'');
          return name && !builtinIds.has(id) && !builtinNames.has(name);
        })
        .map(r => ({
          id: r.id || 'gs'+Math.random(),
          cat: r.kategorie || 'Sonstiges',
          name: r.name || '',
          portion: r.portion || '',
          kcal: +r.kcal || 0,
          ew: +r.ew || 0,
          fett: +r.fett || 0,
          kh: +r.kh || 0,
          kcal100: +r.kcal100 || 0,
          ew100: +r.ew100 || 0,
          fett100: +r.fett100 || 0,
          kh100: +r.kh100 || 0,
          type: 'sheets'
        }));
      countL = sheetsMeals.length;
      console.log('Sheets (ohne Duplikate):', countL);
    }

    if (dataR && dataR.status === 'ok' && dataR.data) {
      const localRezIds=new Set([...rezepte,...BUILTIN_REZEPTE].map(r=>String(r.id)));
      const localRezNames=new Set([...rezepte,...BUILTIN_REZEPTE].map(r=>(r.name||'').toLowerCase().trim()));
      sheetsRezepte = dataR.data
        .filter(r=>!localRezIds.has(String(r.id||''))&&!localRezNames.has((r.name||'').toLowerCase().trim()))
        .map(r => ({
        id: r.id || 'gr'+Math.random(),
        name: r.name || '',
        cat: r.kategorie || 'Mittagessen',
        portionen: +r.portionen || 1,
        kcal: +r.kcal || 0,
        ew: +r.ew || 0,
        fett: +r.fett || 0,
        kh: +r.kh || 0,
        desc: r.beschreibung || '',
        zutaten: Array.isArray(r.zutaten) ? r.zutaten : [],
        portion: '1 von ' + (r.portionen||1) + ' Port.',
        type: 'rezept'
      }));
      countR = sheetsRezepte.length;
    }

    // Cache speichern
    try {
      localStorage.setItem('ep_sheets_cache', JSON.stringify({
        meals: sheetsMeals,
        rezepte: sheetsRezepte,
        ts: Date.now()
      }));
    } catch(e) {}

    // Wochenplan laden
    fetch(SHEETS_URL + '?action=getWochenplan')
      .then(r=>r.json())
      .then(wpData=>{
        if(wpData.status==='ok'&&wpData.data){
          sheetWochenplan=wpData.data;
          save();
          refresh();
          console.log('Wochenplan geladen');
        }
      }).catch(e=>console.warn('Wochenplan:',e));

    sheetsLoaded = true;
    const total = countL + countR;
    showSyncBadge(total);

    if (syncBtn) {
      syncBtn.textContent = total > 0 ? '✅ ' + total + ' geladen' : '⚠️ Leer';
      syncBtn.disabled = false;
      setTimeout(() => {
        if (syncBtn) syncBtn.textContent = '🔄 Sync';
      }, 3000);
    }
    refresh();

  }).catch(e => {
    console.warn('Sync fehlgeschlagen:', e);
    if (syncBtn) {
      syncBtn.textContent = '❌ Fehler';
      syncBtn.disabled = false;
      setTimeout(() => { if(syncBtn) syncBtn.textContent = '🔄 Sync'; }, 3000);
    }
  });
}

function allMeals(){
  const all=[...BUILTIN,...sheetsMeals,...customMeals,...rezepte,...sheetsRezepte].map(m=>{
    if(!m.kcal100&&m.kcal&&m.g){
      return{...m,kcal100:Math.round(m.kcal/m.g*100),ew100:Math.round(m.ew/m.g*100),fett100:Math.round(m.fett/m.g*100),kh100:Math.round(m.kh/m.g*100)};
    }
    return m;
  });
  // Deduplizieren: gleicher Name → nur erster Eintrag
  const seen=new Set();
  const deduped=all.filter(m=>{
    const key=(m.name||'').toLowerCase().trim();
    if(!key||seen.has(key))return false;
    seen.add(key);
    return true;
  });
  // Favoriten zuerst
  return deduped.sort((a,b)=>{
    const af=favoriten.includes(a.id)?1:0;
    const bf=favoriten.includes(b.id)?1:0;
    return bf-af;
  });
}

function targets(w){
  const p=profile,wt=w||p.gewicht;
  const gu=447.6+(9.2*wt)+(3.1*p.groesse)-(4.3*p.alter);
  const zk=Math.round(gu*p.aktivitaet-500);
  const ew=Math.round(Math.min(wt,80)*1.6);  // Eiweißziel auf Zielgewicht ~78-80kg basiert → ~130g
  const fett=Math.round(zk*0.28/9);
  const kh=Math.round((zk-(ew*4)-(fett*9))/4);
  return{zk,ew,fett,kh,bal:25};  // Ballaststoff-Ziel: 25g/Tag
}

function getDay(k){
  if(!days[k])days[k]={fruehstueck:[],mittagessen:[],abendessen:[],snacks:[]};
  const d=days[k];
  // Migrate old single-item format to array
  ['fruehstueck','mittagessen','abendessen'].forEach(s=>{
    if(d[s]&&!Array.isArray(d[s]))d[s]=d[s]?[d[s]]:[];
    if(!d[s])d[s]=[];
  });
  return d;
}
function sportKcal(met,dauer,gew){return Math.round(met*(gew||profile.gewicht)*(dauer/60));}
function sportDayTotal(k){return(sportLog[k]||[]).reduce((a,e)=>a+e.kcal,0);}

function dayTotals(k){
  const d=getDay(k);let kcal=0,ew=0,fett=0,kh=0,bal=0;
  ['fruehstueck','mittagessen','abendessen'].forEach(s=>{
    (d[s]||[]).forEach(item=>{kcal+=item.kcal||0;ew+=item.ew||0;fett+=item.fett||0;kh+=item.kh||0;bal+=+item.bal||0;});
  });
  (d.snacks||[]).forEach(s=>{kcal+=s.kcal||0;ew+=s.ew||0;fett+=s.fett||0;kh+=s.kh||0;bal+=+s.bal||0;});
  const sk=sportDayTotal(k);
  return{kcal:kcal-sk,sportKcal:sk,ew,fett,kh,bal:Math.round(bal*10)/10};
}

      <button onclick="setWaterManual('${dk}')" style="padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;white-space:nowrap;color:#111">+ Eintragen</button>
      <button onclick="resetWater('${dk}')" style="padding:8px 10px;border:1px solid #eee;border-radius:8px;background:none;cursor:pointer;font-size:11px;color:#aaa">Reset</button>
    </div>`;
}
function calcStreak(t){
  let streak=0;
  const today=new Date();
  for(let i=1;i<=365;i++){
    const d=new Date(today);
    d.setDate(d.getDate()-i);
    const dk2=d.toISOString().slice(0,10);
    const day=days[dk2];
    if(!day)break;
    const tot2=dayTotals(dk2);
    if(tot2.kcal>=t.zk*0.7&&tot2.kcal<=t.zk*1.2)streak++;
    else break;
  }
  return streak;
}

window.editPortion=function(dk,slot,idx){

  `;

window.applyFactor=function(dk,slot,idx,factor){
  const d=getDay(dk);
  if(!d||!d[slot]||!d[slot][idx])return;
  const m=d[slot][idx];
  if(!m._orig)m._orig={kcal:m.kcal,ew:m.ew,fett:m.fett,kh:m.kh};
  const o=m._orig;
  m.kcal=Math.round(o.kcal*factor);
  m.ew=Math.round(o.ew*factor);
  m.fett=Math.round(o.fett*factor);
  m.kh=Math.round(o.kh*factor);
  m.portion=(m.portion||'').replace(/ ×[\d.]+\)/,'').replace(/ \(×[\d.]+\)/,'')+' (×'+factor+')';
  save();closeModal();refresh();
};
window.applyGrams=function(dk,slot,idx,k100,e100,f100,kh100){
  const g=parseFloat(document.getElementById('edit-g').value)||0;
  if(!g)return;
  const d=getDay(dk);
  if(!d||!d[slot]||!d[slot][idx])return;
  const m=d[slot][idx];
  m.kcal=Math.round(k100*g/100);
  m.ew=Math.round(e100*g/100);
  m.fett=Math.round(f100*g/100);
  m.kh=Math.round(kh100*g/100);
  m.g=g;
  m.portion=g+'g (angepasst)';
  save();closeModal();refresh();
};

function openPicker(dk,slot,lbl){
  let search='',activeCat='Alle';
  // Store for global access
  window._pDk=dk;
  window._pSlot=slot;
  const cats=['Alle','Frühstück','Mittagessen','Abendessen','Snack herzhaft','Snack süß','Snack Protein','Snack Süßes','Obst','Proteinquelle','Wurst','Beilage','Gemüse','Backwaren','Aufstrich','Käse','Convenience','Restaurant','Aus Sheets','Eigene','Rezepte'];
  function smartScore(m,restKcal,restEw,restFett,restKh){
    // Returns score 0-3 and color for traffic light
    // Priority: EW > Fett > Kcal > KH
    const kcalOk=m.kcal<=restKcal*1.1;
    const ewOk=m.ew<=restEw+5; // small tolerance
    const fettOk=m.fett<=restFett+3;
    if(kcalOk&&ewOk&&fettOk)return{score:3,color:'#1D9E75',bg:'#F0FDF4',label:'passt gut'};
    if(kcalOk&&fettOk)return{score:2,color:'#E67E22',bg:'#FFF8F0',label:'EW leicht hoch'};
    if(kcalOk)return{score:1,color:'#E67E22',bg:'#FEF9E7',label:'Fett/EW prüfen'};
    return{score:0,color:'#E24B4A',bg:'#FFF5F5',label:'über Budget'};
  }
  function renderList(){
    const tot=dayTotals(dk);
    const t=targets();
    const restKcal=Math.max(0,t.zk-tot.kcal);
    const restEw=Math.max(0,t.ew-tot.ew);
    const restFett=Math.max(0,t.fett-tot.fett);
    const restKh=Math.max(0,t.kh-tot.kh);
    const filtered=allMeals().filter(m=>{
      const cok=activeCat==='Alle'
        ||(activeCat==='Eigene'&&m.type==='custom')
        ||(activeCat==='Rezepte'&&m.type==='rezept')
        ||(activeCat==='Wurst'&&m.cat==='Wurst')
        ||(activeCat==='Aus Sheets'&&(m.type==='sheets'))
        ||m.cat===activeCat;
      return cok&&(!search||m.name.toLowerCase().includes(search.toLowerCase()));
    });
    // Sort: best fit first
    const scored=filtered.map(m=>({m,s:smartScore(m,restKcal,restEw,restFett,restKh)}));
    scored.sort((a,b)=>b.s.score-a.s.score);
    const listEl=document.getElementById('picker-list');
    if(!listEl)return;
    const catEl=document.getElementById('picker-cats');
    if(catEl)catEl.innerHTML=cats.map(c=>`<button class="cat-btn${activeCat===c?' active':''}" onclick="pCat('${c}')">${c}</button>`).join('');
    // Budget bar at top
    const budgetHtml=`<div style="background:#f8f8f8;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:11px;color:#888">
      <span style="margin-right:10px">noch frei:</span>
      <span style="color:#111;font-weight:500">${restKcal} kcal</span>
      <span style="margin:0 6px">·</span>

    const entry={...m};
    if(m.bal100&&m.g)entry.bal=Math.round(m.bal100*m.g/100*10)/10;
    else if(m.bal100&&m.portion){
      const gMatch=m.portion.match(/(\d+)g/);
      if(gMatch)entry.bal=Math.round(m.bal100*parseInt(gMatch[1])/100*10)/10;

    getDay(dk)[slot].push(entry);

  window.addWithCustomPortion=function(id,k100,e100,f100,kh100,dk,slot){
    const m=allMeals().find(x=>x.id==id);
    if(!m)return;
    const g=parseFloat(document.getElementById('portion-g').value)||0;
    if(!g)return;
    const entry={...m,

      kcal:Math.round(k100*g/100),

      fett:Math.round(f100*g/100),
      kh:Math.round(kh100*g/100),
      portion:g+'g (eigene Menge)'
    };
    if(!Array.isArray(getDay(dk)[slot]))getDay(dk)[slot]=[];
    getDay(dk)[slot].push(entry);
    save();closeModal();refresh();
  };
  openModal();render();
}

      </div>

          style="font-size:28px;font-weight:500;width:130px;text-align:center;padding:10px;border:1px solid #ddd;border-radius:8px;background:#f8f8f8;color:#111">

    </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="label" style="margin:0">Verlauf</div>
        <div style="display:flex;gap:5px">${[14,30,90].map(r=>`<button class="range-btn${chartRange===r?' active':''}" onclick="setRange(${r})">${r}T</button>`).join('')}</div>
      </div>
      <canvas id="w-chart" height="160"></canvas>
      <div class="grid3" style="margin-top:12px">
        <div class="metric"><div class="val" style="color:#E24B4A;font-size:16px">${start} kg</div><div class="lbl">Start</div></div>
        <div class="metric"><div class="val" style="color:#1D9E75;font-size:16px">${total>0?'−'+total:'±0'} kg</div><div class="lbl">Abgenommen</div></div>
        <div class="metric"><div class="val" style="font-size:16px">${t.zk}</div><div class="lbl">kcal-Ziel</div></div>
      </div>
    </div>
    <div class="card"><div class="label">Letzte Einträge</div>
      ${hist.length===0?'<div class="empty-state">Noch keine Einträge</div>':''}
      ${hist.map((e,i)=>{const diff=i<hist.length-1?e.w-hist[i+1].w:null;return`<div class="hist-row"><span class="hist-date">${fmtDate(e.date)}</span><span class="hist-w">${e.w.toFixed(1)} kg</span>${diff!==null?`<span class="hist-diff ${diff<0?'diff-neg':'diff-pos'}">${diff>0?'+':''}${diff.toFixed(1)} kg</span>`:'<span class="hist-diff" style="color:#888">Start</span>'}</div>`;}).join('')}
    </div>`;
  previewW(profile.gewicht);drawChart();

window.previewW=v=>{const val=parseFloat(v);if(isNaN(val)||val<30)return;const t=targets(val);const el=document.getElementById('w-preview');if(el)el.innerHTML=`Neue Ziele: <strong>${t.zk} kcal</strong> · EW <strong>${t.ew}g</strong> · Fett <strong>${t.fett}g</strong>`;};
window.setRange=r=>{chartRange=r;renderGewicht();};

function logWeight(){
  const val=parseFloat(document.getElementById('w-inp').value);
  if(isNaN(val)||val<30)return;
  const dateEl=document.getElementById('w-date');
  const dateVal=dateEl?dateEl.value:todayKey();
  // Update profile only if today
  if(dateVal===todayKey()) profile.gewicht=Math.round(val*10)/10;
  const idx=weights.findIndex(e=>e.date===dateVal);
  if(idx>=0)weights[idx].w=Math.round(val*10)/10;
  else weights.push({date:dateVal,w:Math.round(val*10)/10});
  // Sort by date
  weights.sort((a,b)=>a.date.localeCompare(b.date));
  save();renderGewicht();refresh();
}

function drawChart(){
  const canvas=document.getElementById('w-chart');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-28,H=160;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-chartRange);
  const pts=weights.filter(e=>new Date(e.date)>=cutoff);
  if(pts.length<2){ctx.fillStyle='rgba(128,128,128,0.5)';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('Mehr Einträge für Grafik nötig',W/2,H/2);return;}
  const minW=Math.min(...pts.map(p=>p.w)),maxW=Math.max(...pts.map(p=>p.w));
  const pad={t:16,r:12,b:28,l:46},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b,rng=maxW-minW||1;
  const px=i=>pad.l+i*(cw/(pts.length-1));
  const py=w=>pad.t+ch-(((w-minW)/rng)*ch);
  for(let i=0;i<=4;i++){const y=pad.t+(ch/4)*i;ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle='#aaa';ctx.font='10px system-ui';ctx.textAlign='right';ctx.fillText((maxW-((maxW-minW)/4)*i).toFixed(1),pad.l-4,y+3);}
  const n=pts.length,sx=pts.reduce((a,_,i)=>a+i,0),sy=pts.reduce((a,p)=>a+p.w,0),sxy=pts.reduce((a,p,i)=>a+i*p.w,0),sxx=pts.reduce((a,_,i)=>a+i*i,0);
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx),intercept=(sy-slope*sx)/n;
  ctx.strokeStyle='rgba(29,158,117,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(px(0),py(intercept));ctx.lineTo(px(pts.length-1),py(intercept+slope*(pts.length-1)));ctx.stroke();ctx.setLineDash([]);
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0,'rgba(55,138,221,0.18)');grad.addColorStop(1,'rgba(55,138,221,0)');
  ctx.beginPath();ctx.moveTo(px(0),py(pts[0].w));pts.forEach((p,i)=>{if(i>0)ctx.lineTo(px(i),py(p.w));});
  ctx.lineTo(px(pts.length-1),pad.t+ch);ctx.lineTo(px(0),pad.t+ch);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='#378ADD';ctx.lineWidth=2;ctx.lineJoin='round';
  ctx.beginPath();pts.forEach((p,i)=>{i===0?ctx.moveTo(px(i),py(p.w)):ctx.lineTo(px(i),py(p.w));});ctx.stroke();
  pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(px(i),py(p.w),3.5,0,Math.PI*2);ctx.fillStyle='#378ADD';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.5;ctx.stroke();
    if(i===0||i===pts.length-1||i===Math.floor(pts.length/2)){ctx.fillStyle='#aaa';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(fmtDate(p.date),px(i),H-6);}});
}

async function searchOFF(query){
  // Use de.openfoodfacts.org for better CORS support
  const url=`https://de.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8`;
  const res=await fetch(url, {headers:{'Accept':'application/json'}});
  const data=await res.json();
  return(data.products||[]).filter(p=>p.nutriments&&p.nutriments['energy-kcal_100g']>0).map(p=>({
    name:p.product_name||p.product_name_de||'Unbekannt',
    brand:p.brands||'',
    kcal100:Math.round(p.nutriments['energy-kcal_100g']||0),
    ew100:Math.round((p.nutriments['proteins_100g']||0)*10)/10,
    fett100:Math.round((p.nutriments['fat_100g']||0)*10)/10,
    kh100:Math.round((p.nutriments['carbohydrates_100g']||0)*10)/10,
  }));
}

function startMealScanDetection(dk,slot){
  if(!('BarcodeDetector' in window)){

    return;
  }
  const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
  const video=document.getElementById('scanner-video');
  let scanning=true;
  async function detect(){
    if(!scanning||!video||video.readyState<2)return setTimeout(detect,200);
    try{
      const barcodes=await detector.detect(video);
      if(barcodes.length>0){scanning=false;lookupMealBarcode(barcodes[0].rawValue,dk,slot);}
      else setTimeout(detect,300);
    }catch{setTimeout(detect,500);}
  }
  detect();
}

  function renderIPList(){
    const filtered=allMeals().filter(m=>{
      if(!m.kcal100&&!m.kcal)return false;
      const cok=activeCat==='Alle'||m.cat===activeCat;
      return cok&&(!search||m.name.toLowerCase().includes(search.toLowerCase()));
    });
    const listEl=document.getElementById('ip-list');
    const catEl=document.getElementById('ip-cats');
    if(catEl)catEl.innerHTML=cats.map(c=>`<button class="cat-btn${activeCat===c?' active':''}" onclick="ipCat('${c}')">${c}</button>`).join('');
    if(listEl)listEl.innerHTML=filtered.slice(0,40).map(m=>{
      const k100=m.kcal100||Math.round((m.kcal||0)/((m.g||100)/100));
      const e100=m.ew100||Math.round((m.ew||0)/((m.g||100)/100));
      const f100=m.fett100||Math.round((m.fett||0)/((m.g||100)/100));
      const kh100=m.kh100||Math.round((m.kh||0)/((m.g||100)/100));
      return `<div class="food-item" onclick="pickIngFromDB(${ingIdx},'${m.name.replace(/'/g,"\\'")}',${k100},${e100},${f100},${kh100})">
        <div style="flex:1">
          <div class="food-name">${m.name}</div>
          <div class="food-detail">pro 100g: ${k100} kcal · EW ${e100}g · F ${f100}g · KH ${kh100}g</div>
        </div>
        <span class="food-kcal" style="font-size:11px;color:#888">${m.portion||''}</span>
      </div>`;
    }).join('')+(filtered.length===0?'<div class="empty-state">Keine Treffer</div>':'');
  }

  document.getElementById('modal-content').innerHTML=`
    <button class="close-btn" onclick="closeModal()">×</button>
    <div class="modal-title">Zutat aus Datenbank wählen</div>
    <div class="tip" style="margin-bottom:8px">Nährwerte werden automatisch übernommen – du gibst nur noch die Grammzahl ein</div>

window.updI=(i,k,v)=>{if(ingredients[i])ingredients[i][k]=v;};

window.doSearchOFF=async(i)=>{
  const nameEl=document.getElementById(`ing-name-${i}`);
  const resEl=document.getElementById(`off-results-${i}`);
  if(!nameEl||!resEl)return;
  const query=nameEl.value||ingredients[i].name;
  if(!query.trim()){resEl.innerHTML=`<div style="font-size:12px;color:#E24B4A;padding:6px 0">Bitte erst Zutatname eingeben</div>`;return;}
  resEl.innerHTML=`<div style="padding:10px 0;font-size:13px;color:#888"><span class="spin"></span> Suche läuft...</div>`;
  try{
    const results=await searchOFF(query);
    if(!results.length){resEl.innerHTML=`<div style="font-size:12px;color:#888;padding:8px 0">Keine Ergebnisse – bitte manuell eingeben.</div>`;return;}
    window._offR=window._offR||{};window._offR[i]=results;
    resEl.innerHTML=`<div style="font-size:11px;color:#888;margin:8px 0 4px">Treffer:</div>`+
      results.slice(0,6).map((r,ri)=>`<div class="food-item" onclick="pickOFF(${i},${ri})">
        <div style="flex:1"><div class="food-name">${r.name}${r.brand?' <span class="food-badge badge-off">'+r.brand+'</span>':''}</div>
        <div class="food-detail">pro 100g: ${r.kcal100} kcal · EW ${r.ew100}g · Fett ${r.fett100}g · KH ${r.kh100}g</div></div></div>`).join('');
  }catch{resEl.innerHTML=`<div style="font-size:12px;color:#E24B4A;padding:8px 0">Suche fehlgeschlagen – manuell eingeben.</div>`;}
};

window.pickOFF=(i,ri)=>{
  const r=(window._offR||{})[i]&&window._offR[i][ri];if(!r)return;
  ingredients[i]={...ingredients[i],name:r.name,kcal100:r.kcal100,ew100:r.ew100,fett100:r.fett100,kh100:r.kh100,fromOff:true};
  renderIngList();
};

window.calcRez=()=>{
  const name=document.getElementById('rn').value||'Mein Rezept';
  const port=Math.max(1,+document.getElementById('rp').value||1);
  const cat=document.getElementById('rcat').value;
  let tk=0,te=0,tf=0,tkh=0;
  ingredients.forEach(g=>{const f=(g.g||0)/100;tk+=g.kcal100*f;te+=g.ew100*f;tf+=g.fett100*f;tkh+=g.kh100*f;});
  const pk=Math.round(tk/port),pe=Math.round(te/port),pf=Math.round(tf/port),pkh=Math.round(tkh/port);
  document.getElementById('rez-result').innerHTML=`<div class="card" style="background:#f8f8f8;margin-top:8px">
    <div style="font-weight:500;font-size:13px;margin-bottom:4px">${name} – pro Portion</div>
    <div style="font-size:12px;color:#888;margin-bottom:10px">Gesamt: ${Math.round(tk)} kcal · ${port} Portionen</div>
    <div class="grid2"><div class="metric"><div class="val">${pk}</div><div class="lbl">kcal</div></div><div class="metric"><div class="val">${pe}g</div><div class="lbl">Eiweiß</div></div><div class="metric"><div class="val">${pf}g</div><div class="lbl">Fett</div></div><div class="metric"><div class="val">${pkh}g</div><div class="lbl">KH</div></div></div>
    <button class="primary-btn" onclick="saveRez('${name.replace(/'/g,"&#39;")}',${port},'${cat}',${pk},${pe},${pf},${pkh})">Rezept speichern</button>
  </div>`;
};


window.editRezept=function(idx){
  const r=rezepte[idx];
  if(!r)return;
  // Load recipe into the Rezept-Rechner
  setDbSub('rezepte');
  renderDatenbank();
  // Pre-fill the form
  setTimeout(()=>{
    const nameEl=document.getElementById('rn');
    const portEl=document.getElementById('rp');
    const catEl=document.getElementById('rcat');
    const descEl=document.getElementById('rdesc');
    if(nameEl)nameEl.value=r.name;
    if(portEl)portEl.value=r.portionen||1;
    if(catEl)catEl.value=r.cat;
    if(descEl)descEl.value=r.desc||'';
    // Load ingredients
    if(r.zutaten&&r.zutaten.length>0){
      ingredients=r.zutaten.map(z=>({...z}));
    }
    renderIngList();
    // Mark as editing
    document.getElementById('rez-result').innerHTML=`<div style="background:#FEF9E7;border:1px solid #F39C12;border-radius:8px;padding:8px;font-size:12px;color:#7D6608;margin-bottom:8px">✏️ Bearbeitungsmodus – Rezept "${r.name}" wird überschrieben wenn du speicherst</div>`;
    // Override saveRez to update instead of add
    window._editingRezIdx=idx;
  },100);
  switchTab('datenbank');
};
window.saveRez=async(name,port,cat,pk,pe,pf,pkh)=>{
  const descEl=document.getElementById('rdesc');
  const desc=descEl?descEl.value:'';
  const ings=ingredients.map(g=>({name:g.name,g:g.g,kcal100:g.kcal100,ew100:g.ew100,fett100:g.fett100,kh100:g.kh100}));
  const newRez={id:'r'+Date.now(),name,cat,portion:`1 von ${port} Port.`,portionen:port,kcal:pk,ew:pe,fett:pf,kh:pkh,type:'rezept',desc,zutaten:ings};
  // Handle edit mode
  if(window._editingRezIdx!==undefined){
    const idx=window._editingRezIdx;
    delete window._editingRezIdx;
    newRez.id=rezepte[idx].id;
    rezepte[idx]=newRez;
  } else {
    rezepte.push(newRez);
  }
  save();ingredients=[];
  // Auch in Google Sheets speichern
  saveToSheets(newRez,'rezept').then(sheetsId=>{
    if(sheetsId) console.log('Rezept in Sheets gespeichert:', sheetsId);
  });
  document.getElementById('rez-result').innerHTML=`<div style="color:#1D9E75;font-size:13px;font-weight:500;padding:10px 0">✅ Gespeichert lokal & in Google Sheets!</div>`;
  setTimeout(()=>{setDbSub('mahlzeiten');renderDatenbank();},1400);
};

window.saveMounjaro=function(){
  const datum=document.getElementById('mj-date').value;
  const dosis=document.getElementById('mj-dosis').value+' mg';
  const stelle=document.getElementById('mj-stelle').value;
  const bef=document.getElementById('mj-bef').value;
  const gew=document.getElementById('mj-gew').value;
  const notiz=document.getElementById('mj-notiz').value;
  
  mounjaro.push({datum,dosis,stelle,befinden:bef,gewicht:gew?parseFloat(gew):null,notiz});
  
  // Gewicht auch in weights eintragen falls angegeben
  if(gew){
    const g=parseFloat(gew);
    const idx=weights.findIndex(e=>e.date===datum);
    if(idx>=0)weights[idx].w=g; else weights.push({date:datum,w:g});
    weights.sort((a,b)=>a.date.localeCompare(b.date));
    profile.gewicht=g;
  }
  
  save();
  
  // Auch ins Google Sheet speichern
  saveToSheets({
    action:'addMounjaro',
    datum,dosis,stelle,befinden:bef,gewicht:gew||'',notiz
  },'mounjaro');
  
  renderMounjaro();
  
  // Bestätigung
  const c=document.createElement('div');
  c.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#8E44AD;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;white-space:nowrap';
  c.textContent='💉 Injektion gespeichert!';
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),3000);
};

window.delMounjaro=function(idx){
  mounjaro.splice(idx,1);
  save();renderMounjaro();
};

              <summary style="font-size:12px;color:#185FA5;cursor:pointer;margin-bottom:4px">Zubereitung</summary>
              <div style="margin-top:6px;font-size:12px;color:#444;line-height:1.6;padding:8px;background:#f8f8f8;border-radius:8px">${r.desc.replace(/\n/g,'<br>')}</div>
            </details>`:''}
          </div>
          ${idx>=0?`<button class="del-btn" onclick="delR(${idx})" style="flex-shrink:0">×</button>`:''}
        </div>
        ${r.zutaten&&r.zutaten.length?`<button onclick="addToEinkaufById('${r.id}')" style="margin-top:10px;width:100%;padding:8px;border:1px dashed #ddd;border-radius:8px;background:none;cursor:pointer;font-size:12px;color:#185FA5">+ Zutaten zur Einkaufsliste</button>`:''}
      </div>`;
    });
  });
  el.innerHTML=html;
}

(function initFBRezepte(){

  let added=false;
  BUILTIN_REZEPTE.forEach(r=>{if(!existingIds.has(r.id)){rezepte.push(r);added=true;}});
  if(added)save();

function saveEinkauf(){ss('ep_einkauf',einkaufListe);}

function addToEinkaufById(id){
  const r=[...rezepte,...customMeals].find(x=>String(x.id)===String(id));
  if(!r||!r.zutaten||!r.zutaten.length)return;
  r.zutaten.forEach(z=>{
    const key=z.name.toLowerCase().trim();
    const ex=einkaufListe.find(e=>e.name.toLowerCase().trim()===key);
    if(ex){ex.menge=Math.round((ex.menge+z.g)*10)/10;}
    else einkaufListe.push({id:'e'+Date.now()+Math.random(),name:z.name,menge:z.g,einheit:'g',checked:false,rezept:r.name,gruppe:r.cat||'Rezept'});
  });
  saveEinkauf();renderEinkauf();switchTab('einkauf');
}
window.addToEinkaufById=addToEinkaufById;
function addToEinkauf(rezeptIdx,portFaktor){
  const r=rezepte[rezeptIdx];
  if(!r||!r.zutaten)return;
  const faktor=portFaktor||1;
  r.zutaten.forEach(z=>{
    // Try to find existing item with same name and merge
    const key=z.name.toLowerCase().trim();
    const existing=einkaufListe.find(e=>e.name.toLowerCase().trim()===key);
    if(existing){
      existing.menge=Math.round((existing.menge+(z.g*faktor))*10)/10;
    } else {
      einkaufListe.push({
        id:'e'+Date.now()+Math.random(),
        name:z.name,
        menge:Math.round(z.g*faktor*10)/10,
        einheit:'g',
        checked:false,
        rezept:r.name
      });
    }
  });
  saveEinkauf();
  renderEinkauf();
  switchTab('einkauf');
}
window.addToEinkauf=addToEinkauf;

function renderEinkauf(){
  const el=document.getElementById('einkauf');
  const unchecked=einkaufListe.filter(e=>!e.checked);
  const checked=einkaufListe.filter(e=>e.checked);
  let html=`
    <div class="card" style="padding:10px 14px;margin-bottom:12px;background:#f8f8f8">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:13px;font-weight:500">Einkaufsliste</div>
          <div style="font-size:11px;color:#888">${unchecked.length} offen · ${checked.length} erledigt</div>
        </div>
        <div style="display:flex;gap:6px">
          <button onclick="openAddEinkauf()" style="padding:6px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:#111">+ Manuell</button>
          <button onclick="clearChecked()" style="padding:6px 10px;border:1px solid #eee;border-radius:8px;background:none;cursor:pointer;font-size:11px;color:#aaa">Erledigte löschen</button>
        </div>
      </div>
    </div>`;

  // Wochenplan auswählen
  html+=`<div class="card" style="padding:12px 14px;margin-bottom:12px">
    <div style="font-size:13px;font-weight:500;margin-bottom:8px">Aus Wochenplan übernehmen</div>
    <div style="font-size:12px;color:#888;margin-bottom:8px">Wähle Tage, für die du einkaufen möchtest:</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
      ${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>`<button class="cat-btn" id="day-sel-${i}" onclick="toggleDayEinkauf(${i})">${d}</button>`).join('')}
    </div>
    <button onclick="addDaysToEinkauf()" style="width:100%;padding:9px;border:1px solid #185FA5;border-radius:8px;background:none;cursor:pointer;font-size:13px;color:#185FA5;font-weight:500">Zutaten der gewählten Tage hinzufügen</button>
  </div>`;

  if(!einkaufListe.length){
    html+=`<div class="empty-state">Liste ist leer.<br>Rezept aus dem Rezeptbuch hinzufügen oder manuell eintragen.</div>`;
    el.innerHTML=html;return;
  }

  // Gruppiere nach Kategorie/Herkunft
  const groups={};
  unchecked.forEach(item=>{
    const g=item.gruppe||'Sonstiges';
    if(!groups[g])groups[g]=[];
    groups[g].push(item);
  });

  Object.keys(groups).sort().forEach(grp=>{
    html+=`<div class="section-head">${grp}</div><div class="card" style="padding:4px 14px">`;
    groups[grp].forEach(item=>{
      const idx=einkaufListe.indexOf(item);
      const mengeStr=item.einheit==='Stück'?`${item.menge} Stück`:
                     item.menge>=1000?`${(item.menge/1000).toFixed(1).replace('.0','')} kg`:
                     `${item.menge} g`;
      html+=`<div class="meal-row" onclick="toggleCheck(${idx})" style="cursor:pointer">
        <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${item.checked?'#1D9E75':'#ddd'};background:${item.checked?'#1D9E75':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center">
          ${item.checked?'<span style="color:#fff;font-size:12px">✓</span>':''}
        </div>
        <div class="meal-info">
          <div class="meal-name" style="${item.checked?'text-decoration:line-through;color:#aaa':''}">${item.name}</div>
          ${item.rezept?`<div class="meal-macro">für: ${item.rezept}</div>`:''}
        </div>
        <span style="font-size:13px;font-weight:500;color:${item.checked?'#aaa':'#111'};white-space:nowrap">${mengeStr}</span>
        <button class="del-btn" onclick="event.stopPropagation();removeEinkauf(${idx})">×</button>
      </div>`;
    });
    html+=`</div>`;
  });

  if(checked.length){
    html+=`<div class="section-head" style="color:#aaa">Erledigt (${checked.length})</div><div class="card" style="padding:4px 14px;opacity:0.5">`;
    checked.forEach(item=>{
      const idx=einkaufListe.indexOf(item);
      const mengeStr=item.menge>=1000?`${(item.menge/1000).toFixed(1)} kg`:`${item.menge} g`;
      html+=`<div class="meal-row" onclick="toggleCheck(${idx})" style="cursor:pointer">
        <div style="width:22px;height:22px;border-radius:50%;border:2px solid #1D9E75;background:#1D9E75;flex-shrink:0;display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:12px">✓</span></div>
        <div class="meal-info"><div class="meal-name" style="text-decoration:line-through;color:#aaa">${item.name}</div></div>
        <span style="font-size:12px;color:#aaa">${mengeStr}</span>
      </div>`;
    });
    html+=`</div>`;
  }
  el.innerHTML=html;
}

window.toggleCheck=function(idx){
  if(einkaufListe[idx])einkaufListe[idx].checked=!einkaufListe[idx].checked;
  saveEinkauf();renderEinkauf();
};
window.removeEinkauf=function(idx){
  einkaufListe.splice(idx,1);saveEinkauf();renderEinkauf();
};
window.clearChecked=function(){
  einkaufListe=einkaufListe.filter(e=>!e.checked);saveEinkauf();renderEinkauf();
};

let selectedDays=[];
window.toggleDayEinkauf=function(i){
  const btn=document.getElementById('day-sel-'+i);
  if(selectedDays.includes(i)){selectedDays=selectedDays.filter(d=>d!==i);if(btn){btn.classList.remove('active');}}
  else{selectedDays.push(i);if(btn){btn.classList.add('active');}}
};

window.addDaysToEinkauf=function(){
  if(!selectedDays.length)return;
  const dayKeys=[];
  const today=new Date();
  // Map Mo=0..So=6 to actual dates in current week
  const todayDow=(today.getDay()+6)%7; // 0=Mon
  selectedDays.forEach(d=>{
    const diff=d-todayDow;
    const date=new Date(today);date.setDate(today.getDate()+diff);
    dayKeys.push(date.toISOString().slice(0,10));
  });

  dayKeys.forEach(dk=>{
    const day=days[dk];if(!day)return;
    ['fruehstueck','mittagessen','abendessen'].forEach(slot=>{
      const slotItems=Array.isArray(day[slot])?day[slot]:(day[slot]?[day[slot]]:[]);
      slotItems.forEach(meal=>{
      if(!meal)return;
      // Find rezept with zutaten
      const rez=rezepte.find(r=>r.id===meal.id||r.name===meal.name);
      if(rez&&rez.zutaten&&rez.zutaten.length){
        rez.zutaten.forEach(z=>{
          const key=z.name.toLowerCase().trim();
          const existing=einkaufListe.find(e=>e.name.toLowerCase().trim()===key);
          if(existing){existing.menge=Math.round((existing.menge+z.g)*10)/10;}
          else{einkaufListe.push({id:'e'+Date.now()+Math.random(),name:z.name,menge:z.g,einheit:'g',checked:false,rezept:rez.name,gruppe:rez.cat});}
        });
      } else if(meal){
        const key=meal.name.toLowerCase().trim();
        if(!einkaufListe.find(e=>e.name.toLowerCase().trim()===key)){
          einkaufListe.push({id:'e'+Date.now()+Math.random(),name:meal.name,menge:1,einheit:'Stück',checked:false,rezept:meal.name,gruppe:meal.cat||'Mahlzeiten'});
        }
      }
      }); // close slotItems.forEach
    });
  });
  saveEinkauf();selectedDays=[];renderEinkauf();
};

// ── BARCODE SCANNER ───────────────────────────────────────────────────────────
let scannerStream=null;

async function openBarcodeScanner(){
  document.getElementById('modal-content').innerHTML=`
    <button class="close-btn" onclick="closeScanner()">×</button>
    <div class="modal-title">Barcode scannen</div>
    <div class="tip">Kamera auf den Barcode richten – wird automatisch erkannt</div>
    <div class="scanner-wrap" id="scanner-wrap">
      <video id="scanner-video" autoplay playsinline muted></video>
      <div class="scan-overlay"><div class="scan-box"></div></div>
      <div class="scan-line"></div>
    </div>
    <div id="scan-status" style="text-align:center;font-size:13px;color:#888;margin-bottom:10px">Initialisiere Kamera...</div>
    <div id="scan-result"></div>
    <div style="text-align:center;margin-top:8px">
      <button onclick="closeScanner()" style="padding:8px 20px;border:1px solid #ddd;border-radius:8px;background:none;cursor:pointer;font-size:13px;color:#888">Abbrechen</button>
    </div>`;
  openModal();
  try{
    scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.getElementById('scanner-video');
    if(video){video.srcObject=scannerStream;video.play();}
    document.getElementById('scan-status').textContent='Barcode vor die Kamera halten...';
    startBarcodeDetection();
  }catch(e){
    document.getElementById('scan-status').innerHTML='<span style="color:#E24B4A">Kamerazugriff nicht möglich.<br>Bitte Berechtigung erteilen oder manuell suchen.</span>';
  }
}
window.openBarcodeScanner=openBarcodeScanner;

function stopScannerStream(){
  if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;}
}

window.closeScanner=function(){
  stopScannerStream();
  closeModal();
};

let scanDetector=null;
function startBarcodeDetection(){
  if(!('BarcodeDetector' in window)){
    // Fallback: manual barcode entry
    document.getElementById('scan-status').innerHTML='Automatische Erkennung nicht verfügbar.<br>Bitte Barcode manuell eingeben:';
    document.getElementById('scanner-wrap').innerHTML='<input class="inp" type="text" id="manual-barcode" placeholder="Barcode-Nummer eingeben" style="margin:0"><button class="primary-btn" style="margin-top:6px" onclick="lookupBarcode(document.getElementById(\'manual-barcode\').value)">Suchen</button>';
    return;
  }
  const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
  const video=document.getElementById('scanner-video');
  let scanning=true;
  async function detect(){
    if(!scanning||!video||video.readyState<2)return setTimeout(detect,200);
    try{
      const barcodes=await detector.detect(video);
      if(barcodes.length>0){
        scanning=false;
        const code=barcodes[0].rawValue;
        document.getElementById('scan-status').textContent='Barcode erkannt: '+code;
        lookupBarcode(code);
      } else {
        setTimeout(detect,300);
      }
    }catch{setTimeout(detect,500);}
  }
  detect();
}

async function lookupBarcode(code){
  if(!code||!code.trim())return;
  const statusEl=document.getElementById('scan-status');
  const resultEl=document.getElementById('scan-result');
  if(statusEl)statusEl.textContent='Suche Produkt...';
  try{
    const res=await fetch('https://world.openfoodfacts.org/api/v0/product/'+code.trim()+'.json?lc=de');
    const data=await res.json();
    if(data.status===1&&data.product){
      const p=data.product;
      const n=p.nutriments||{};
      const name=p.product_name_de||p.product_name_en||p.product_name||'Unbekanntes Produkt';
      const brand=p.brands||'';
      const kcal100=Math.round(n['energy-kcal_100g']||n['energy_100g']/4.184||0);
      const ew100=Math.round((n.proteins_100g||0)*10)/10;
      const fett100=Math.round((n.fat_100g||0)*10)/10;
      const kh100=Math.round((n.carbohydrates_100g||0)*10)/10;
      const bal100=Math.round((n.fiber_100g||0)*10)/10;
      const serving=p.serving_size||'100g';
      if(statusEl)statusEl.textContent='Produkt gefunden!';
      if(resultEl)resultEl.innerHTML=`
        <div style="background:#f0fdf4;border:1px solid #1D9E75;border-radius:8px;padding:12px;margin-top:8px">
          <div style="font-size:14px;font-weight:500;margin-bottom:4px">${name}${brand?' – '+brand:''}</div>
          <div style="font-size:12px;color:#888;margin-bottom:10px">pro 100g: ${kcal100} kcal · EW ${ew100}g · Fett ${fett100}g · KH ${kh100}g</div>
          <div style="font-size:12px;color:#555;margin-bottom:8px">Menge eingeben:</div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
            <input class="inp" type="number" id="barcode-g" value="100" min="1" style="margin:0;width:90px;flex:none"
              oninput="calcBarcodePreview(${kcal100},${ew100},${fett100},${kh100})">
            <span style="font-size:13px;color:#888">g</span>
            <div id="barcode-preview" style="font-size:12px;color:#185FA5;font-weight:500">${kcal100} kcal · EW ${ew100}g</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="primary-btn" style="margin-top:0" onclick="saveBarcodeProduct('${name.replace(/'/g,"\\'")}','${brand}',${kcal100},${ew100},${fett100},${kh100})">In Datenbank speichern</button>
          </div>
        </div>`;
    } else {
      if(statusEl)statusEl.innerHTML='<span style="color:#E24B4A">Produkt nicht gefunden.<br>Bitte manuell im Rezept-Rechner anlegen.</span>';
    }
  }catch(e){
    if(statusEl)statusEl.innerHTML='<span style="color:#E24B4A">Verbindungsfehler – Internetverbindung prüfen.</span>';
  }
}
window.lookupBarcode=lookupBarcode;

window.calcBarcodePreview=function(k,e,f,kh){
  const g=parseFloat(document.getElementById('barcode-g').value)||0;
  const el=document.getElementById('barcode-preview');
  if(el)el.textContent=Math.round(k*g/100)+' kcal · EW '+Math.round(e*g/100)+'g · F '+Math.round(f*g/100)+'g · KH '+Math.round(kh*g/100)+'g';
};

window.saveBarcodeProduct=function(name,brand,k100,e100,f100,kh100){
  const g=parseFloat(document.getElementById('barcode-g').value)||100;
  const fullName=brand?name+' ('+brand+')':name;
  const newItem={
    id:'scan'+Date.now(),
    name:fullName,
    cat:'Snack',
    portion:g+'g',
    kcal:Math.round(k100*g/100),
    ew:Math.round(e100*g/100),
    fett:Math.round(f100*g/100),
    kh:Math.round(kh100*g/100),
    kcal100:k100,ew100:e100,fett100:f100,kh100:kh100,
    bal100:bal100||0,
    g:g,
    type:'custom'
  };
  customMeals.push(newItem);
  save();
  // Auch in Google Sheets speichern
  saveToSheets({...newItem,cat:'Supermarkt (gescannt)'},'lebensmittel');
  stopScannerStream();
  closeModal();
  // Show confirmation
  const confirm=document.createElement('div');
  confirm.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1D9E75;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;white-space:nowrap';
  confirm.textContent=fullName+' gespeichert!';
  document.body.appendChild(confirm);
  setTimeout(()=>confirm.remove(),3000);
  if(activeTab==='datenbank')renderDatenbank();
};
let activeTab='heute';
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',['heute','morgen','gewicht','datenbank','rezeptbuch','einkauf','sport','mounjaro'][i]===tab);});
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  refresh();
}

function refresh(){
  if(activeTab==='heute')renderDay('heute',todayKey(),'Heute');
  else if(activeTab==='morgen')renderDay('morgen',tomorrowKey(),'Morgen');
  else if(activeTab==='gewicht')renderGewicht();
  else if(activeTab==='datenbank')renderDatenbank();
  else if(activeTab==='rezeptbuch')renderRezeptbuch();
  else if(activeTab==='einkauf')renderEinkauf();
  else if(activeTab==='sport')renderSport();
  else if(activeTab==='mounjaro')renderMounjaro();
}

// Auto-Tagebucheintrag beim Tageswechsel
(function checkDayChange(){
  const lastDay=localStorage.getItem('ep_last_day');

    // Gestern automatisch ins Tagebuch

})();
refresh();

loadFromSheets().then(()=>{
